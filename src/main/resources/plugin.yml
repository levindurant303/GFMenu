name: GFMenu
version: R1.3.0
main: gofd.gFMenu.GFMenu
api-version: "1.21"
authors: [GOFD]
description: Menu system with TrMenu and DeluxeMenus compatible formats.

commands:
  gfmenu:
    description: Manage GFMenu menus
    usage: /gfmenu [open|info|list|reload|edit|close|checkin|update|backup|validate]
    aliases: [gfm]
    permission: gfmenu.use

permissions:
  gfmenu.use:
    description: Use GFMenu commands
    default: true
  gfmenu.open:
    description: Open menus through /gfmenu open
    default: true
  gfmenu.info:
    description: Show menu diagnostics
    default: op
  gfmenu.checkin:
    description: Claim and view daily check-in rewards
    default: true
  gfmenu.admin:
    description: Reload and edit menus
    default: op
